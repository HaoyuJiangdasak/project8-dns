#version=RHEL8
# Project8 - Client1
cdrom
lang en_US.UTF-8
keyboard --vckeymap=us --xlayouts='us'
timezone Asia/Shanghai --isUtc
network --bootproto=static --device=eth0 --ip=192.168.10.11 --netmask=255.255.255.0 --gateway=192.168.10.254 --nameserver=192.168.10.1 --hostname=Client1 --onboot=on --activate
# root password intentionally omitted; inject it securely when provisioning.
# user password intentionally omitted; inject it securely when provisioning.
firewall --enabled --ssh
selinux --enforcing
ignoredisk --only-use=sda
zerombr
clearpart --all --initlabel
autopart --type=lvm
bootloader --location=mbr --boot-drive=sda
services --enabled=sshd,chronyd,gdm
reboot

%packages
@^graphical-server-environment
@gnome-desktop
kexec-tools
%end

%addon com_redhat_kdump --enable --reserve-mb='auto'
%end

%post --log=/root/ks-post.log
echo "Client1 kickstart post OK" >> /root/ks-post.log
echo "jianghaoyu ALL=(ALL) ALL" > /etc/sudoers.d/jianghaoyu
chmod 440 /etc/sudoers.d/jianghaoyu
hostnamectl set-hostname Client1 || true
%end
